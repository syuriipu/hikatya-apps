<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hikatya apps</title>
<link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #fbeef5; color: #4a3a44; font-family: "Zen Maru Gothic", sans-serif; line-height: 1.8; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 20px; text-align: center; }
  h1 { font-family: "Hachi Maru Pop", cursive; font-weight: 400; font-size: 28px; margin: 0 0 24px; }
  a.app {
    display: flex; align-items: center; gap: 16px; text-align: left;
    background: #fff; border-radius: 18px; padding: 14px 18px; margin-bottom: 12px;
    color: inherit; text-decoration: none; box-shadow: 0 2px 8px rgba(160, 60, 120, 0.06);
  }
  a.app img { width: 56px; height: 56px; border-radius: 13px; }
  a.app b { display: block; }
  a.app span { font-size: 14px; color: #8a7682; }
  footer { color: #8a7682; font-size: 13px; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1>hikatya apps</h1>
  <a class="app" href="kawaii-memo/">
    <img src="kawaii-memo/icon.png" alt="">
    <div><b>かわいいメモ帳</b><span>サポート・プライバシーポリシー</span></div>
  </a>
  <footer>お問い合わせ：hikatya.apps@gmail.com</footer>
</main>
</body>
</html>
